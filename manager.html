<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیر</title>

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial;
            background: #f3f6fa;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>👨‍💼 پنل مدیر</h1>
    <p>مدیریت مدرسه</p>
</header>

<div class="container">

    <div class="card">
        <h2>👨‍🎓 دانش‌آموزان</h2>
        <p>مدیریت دانش‌آموزان مدرسه</p>
        <button>مشاهده دانش‌آموزان</button>
    </div>

    <div class="card">
        <h2>📊 نمرات</h2>
        <p>مشاهده و مدیریت نمرات</p>
        <button>مشاهده نمرات</button>
    </div>

    <div class="card">
        <h2>⚠️ تخلفات</h2>
        <p>مشاهده تخلفات دانش‌آموزان</p>
        <button>مشاهده تخلفات</button>
    </div>

    <div class="card">
        <h2>📄 کارنامه‌ها</h2>
        <p>مدیریت و انتشار کارنامه‌ها</p>
        <button>مدیریت کارنامه‌ها</button>
    </div>

</div>

</body>
</html>
