<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه مدرسه</title>

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f6fa;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<header>
    <h1>🏫 سامانه مدرسه</h1>
    <p>سامانه مدیریت مدرسه</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>خوش آمدید</h2>

        <p>
            برای ورود، نوع حساب خود را انتخاب کنید.
        </p>

        <div class="buttons">
            <button>👨‍💼 مدیر</button>
            <button>👨‍🏫 معلم</button>
            <button>👩 مادر</button>
        </div>
    </div>

</div>

</body>
</html>
