<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مادر</title>

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial;
            background: #f3f6fa;
        }

        header {
            background: #7c3aed;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>👩 پنل مادر</h1>
    <p>اطلاعات فرزند شما</p>
</header>

<div class="container">

    <div class="card">
        <h2>👨‍🎓 علی رضایی</h2>
        <p>کلاس: هشتم الف</p>
    </div>

    <div class="card">
        <h2>📊 نمرات</h2>
        <p>مشاهده نمرات فرزند</p>
        <button>مشاهده نمرات</button>
    </div>

    <div class="card">
        <h2>⚠️ هشدارها</h2>
        <p>مشاهده تخلفات و هشدارها</p>
        <button>مشاهده هشدارها</button>
    </div>

    <div class="card">
        <h2>📄 کارنامه</h2>
        <p>مشاهده کارنامه فرزند</p>
        <button>مشاهده کارنامه</button>
    </div>

</div>

</body>
</html>
