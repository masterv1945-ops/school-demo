<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل معلم</title>

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial;
            background: #f3f6fa;
        }

        header {
            background: #047857;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #059669;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>👨‍🏫 پنل معلم</h1>
    <p>مدیریت دانش‌آموزان و نمرات</p>
</header>

<div class="container">

    <div class="card">
        <h2>👨‍🎓 دانش‌آموزان</h2>
        <p>مشاهده دانش‌آموزان کلاس</p>
        <button>مشاهده</button>
    </div>

    <div class="card">
        <h2>📝 ثبت نمره</h2>
        <p>ثبت نمره برای دانش‌آموزان</p>
        <button>ثبت نمره</button>
    </div>

    <div class="card">
        <h2>⚠️ ثبت تخلف</h2>
        <p>ثبت تخلف دانش‌آموز</p>
        <button>ثبت تخلف</button>
    </div>

</div>

</body>
</html>
